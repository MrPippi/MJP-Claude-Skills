# Compiles every complete Java template in Skills/ against Paper 26.2 and 1.21.11
# (see verify/build.gradle and scripts/extract-skill-java.mjs).
name: Skills compile

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Skills/**"
      - "verify/**"
      - "scripts/extract-skill-java.mjs"
      - ".github/workflows/skills-compile.yml"
  push:
    branches: ["main"]
    paths:
      - "Skills/**"
      - "verify/**"
      - "scripts/extract-skill-java.mjs"
      - ".github/workflows/skills-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Paper ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            java: "25"
          - mc: "1.21.11"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Extract templates
        run: node scripts/extract-skill-java.mjs ${{ matrix.mc }}

      - name: Compile templates
        working-directory: verify
        run: ./gradlew compileSkills -Pmc=${{ matrix.mc }} --continue
